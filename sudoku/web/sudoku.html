<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku</title>
<style>
  :root {
    --ink: #e8eef6;
    --line: #8b9bb4;
    --thin: #33405a;
    --given: #f4f8fd;
    --user: #5aa9ff;
    --bad: #ff7b72;
    --ok: #56d364;
    --paper: #0d1117;
    --panel: #161d29;
    --panel-edge: #2a3547;
    --muted: #9fb0c6;
    --accent-1: #5aa9ff;
    --accent-2: #a78bfa;
    --accent-3: #56d364;
    --glow-1: rgba(90, 169, 255, 0.18);
    --glow-2: rgba(167, 139, 250, 0.16);
    --btn-bg: #1f2937;
    --btn-border: #33405a;
    --btn-hover: #273449;
    --text-soft: #c3d0e2;
    --grid-bg: #101826;
    --frame: #3d8ef0;
    --frame-glow: rgba(90, 169, 255, 0.16);
    --panel-shadow: rgba(0, 0, 0, 0.35);
    --shadow: rgba(0, 0, 0, 0.45);
    --cell-sel: #1d3557;
    --cell-same: #16304d;
    --cell-wrong: #4a1f22;
    --tip-bg-1: rgba(90, 169, 255, 0.12);
    --tip-bg-2: rgba(167, 139, 250, 0.12);
    --tip-edge: rgba(90, 169, 255, 0.30);
  }

  /* Light theme: same layout, swapped palette. */
  body.light {
    --ink: #12212e;
    --line: #2f3a45;
    --thin: #b8c2cc;
    --given: #12212e;
    --user: #1a56db;
    --bad: #c62828;
    --ok: #1e7a3c;
    --paper: #f4f6f8;
    --panel: #ffffff;
    --panel-edge: #d7dee5;
    --muted: #4a5a68;
    --accent-1: #1a56db;
    --accent-2: #6d28d9;
    --accent-3: #1e7a3c;
    --glow-1: rgba(26, 86, 219, 0.10);
    --glow-2: rgba(109, 40, 217, 0.08);
    --btn-bg: #ffffff;
    --btn-border: #c3ccd6;
    --btn-hover: #eef3f9;
    --text-soft: #33414f;
    --grid-bg: #ffffff;
    --frame: #1a56db;
    --frame-glow: rgba(26, 86, 219, 0.14);
    --panel-shadow: rgba(15, 23, 42, 0.10);
    --shadow: rgba(15, 23, 42, 0.14);
    --cell-sel: #c7ddff;
    --cell-same: #eef4ff;
    --cell-wrong: #fde8e6;
    --tip-bg-1: rgba(26, 86, 219, 0.07);
    --tip-bg-2: rgba(109, 40, 217, 0.07);
    --tip-edge: rgba(26, 86, 219, 0.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1000px 520px at 15% -10%, var(--glow-1), transparent 60%),
      radial-gradient(900px 480px at 95% 0%, var(--glow-2), transparent 55%),
      var(--paper);
    min-height: 100vh;
  }
  header { max-width: 900px; margin: 0 auto 16px; text-align: center; }
  h1 {
    font-size: 22px;
    margin: 0 0 6px;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
  }
  p.lead { margin: 0; color: #4a5a68; font-size: 14px; }
  main { max-width: 900px; margin: 0 auto; display: grid; gap: 18px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 10px 30px var(--panel-shadow);
  }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  button {
    font: inherit;
    font-size: 14px;
    padding: 8px 12px;
    border: 1px solid var(--btn-border);
    border-radius: 8px;
    background: var(--btn-bg);
    color: var(--ink);
    cursor: pointer;
  }
  button:hover { background: var(--btn-hover); border-color: var(--accent-1); }
  button.primary { background: linear-gradient(180deg, #2a6fd4, #1f57ad); border-color: #2a6fd4; color: #fff; }
  button.primary:hover { background: linear-gradient(180deg, #2f7fe0, #2a6fd4); }

  .theme-toggle {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 10;
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--ink);
    box-shadow: 0 6px 18px var(--shadow);
  }
  .theme-toggle:hover { background: var(--btn-hover); border-color: var(--accent-1); }
  label { font-size: 14px; color: var(--muted); }
  select { font: inherit; font-size: 14px; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--ink); }

  .board-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .numbers { display: flex; flex-direction: column; align-items: stretch; width: min(100%, 470px); gap: 8px; }
  .keypad { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; width: 100%; }
  .key-btn { font-size: clamp(15px, 3.4vw, 21px); padding: 10px 0; font-weight: 600; }
  .erase { align-self: center; min-width: 170px; }
  .tip {
    font-size: 14px;
    color: var(--text-soft);
    margin: 4px 0 0;
    line-height: 1.55;
    text-align: center;
    background: linear-gradient(135deg, var(--tip-bg-1), var(--tip-bg-2));
    border: 1px solid var(--tip-edge);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .tip strong { color: var(--accent-1); }
  .tip strong:nth-of-type(2) { color: var(--accent-2); }
  .status-line { margin-top: 16px; text-align: center; }
  .board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    width: min(100%, 470px);
    aspect-ratio: 1 / 1;
    border: 3px solid var(--frame);
    border-radius: 6px;
    overflow: hidden;
    background: var(--grid-bg);
    box-shadow: 0 0 0 3px var(--frame-glow), 0 14px 34px var(--shadow);
    container-type: inline-size;
  }
  @supports (font-size: 1cqw) {
    .cell { font-size: clamp(13px, 6.4cqw, 25px); }
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border-right: 1px solid var(--thin);
    border-bottom: 1px solid var(--thin);
    cursor: pointer;
    user-select: none;
    color: var(--user);
    font-weight: 600;
  }
  .cell.box-right { border-right: 2px solid var(--line); }
  .cell.box-bottom { border-bottom: 2px solid var(--line); }
  .cell.given { color: var(--given); }
  .cell.selected { background: var(--cell-sel); }
  .cell.wrong { background: var(--cell-wrong); color: var(--bad); }
  .cell.filled-ok { color: var(--ok); }
  .cell.same { background: var(--cell-same); }
  .cell.selected { background: var(--cell-sel); outline: 1px solid var(--accent-1); outline-offset: -2px; }
  .board.need-select { animation: nudge 0.45s ease 2; outline: 3px solid transparent; outline-offset: 4px; }
  @keyframes nudge {
    0%, 100% { outline-color: transparent; }
    50% { outline-color: var(--bad); }
  }

  #status { font-size: 14px; min-height: 20px; color: var(--text-soft); }
  #status.good { color: var(--ok); }
  #status.bad { color: var(--bad); }

  h2 { font-size: 16px; margin: 0 0 4px; }
  .help { font-size: 13px; color: #5b6b79; margin: 0 0 12px; }
  .python-item {
    border: 1px solid #d7dee5;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .python-item h3 { font-size: 14px; margin: 0 0 6px; }
  .meta { font-size: 12px; color: #5b6b79; margin: 0 0 6px; }
  code.text {
    display: block;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px;
    background: #f2f5f8;
    border: 1px solid #e0e6ec;
    border-radius: 6px;
    padding: 6px 8px;
    margin: 0 0 8px;
    word-break: break-all;
  }
  details summary { cursor: pointer; font-size: 14px; font-weight: 600; }
  details p, details li { font-size: 14px; color: var(--text-soft); }

  /* Narrow windows, small laptops and side panels: keep everything readable
     and never let the board or the number pad run off the screen. */
  @media (max-width: 620px) {
    body { padding: 14px 10px 40px; font-size: 15px; }
    .theme-toggle { position: static; display: block; margin: 0 0 10px auto; }
    header, main { max-width: 100%; }
    h1 { font-size: 19px; }
    p.lead { font-size: 14px; }
    main { gap: 12px; }
    .panel { padding: 12px; border-radius: 8px; }
    .keypad { gap: 4px; }
    .key-btn { font-size: 16px; padding: 9px 0; }
    .tip { font-size: 13px; }
    #status { font-size: 14px; }
  }
  @media (max-width: 380px) {
    .keypad { gap: 3px; }
    .key-btn { font-size: 14px; padding: 8px 0; }
    .erase { min-width: 140px; }
  }
</style>
</head>
<body>

<button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">☀ Light mode</button>

<header>
  <h1>Sudoku</h1>
</header>

<main>

  <section class="panel toolbar">
    <label for="clues">Clues</label>
    <select id="clues">
      <option value="40">40 (easy)</option>
      <option value="34">34</option>
      <option value="30" selected>30 (normal)</option>
      <option value="26">26 (hard)</option>
      <option value="24">24 (very hard)</option>
    </select>
    <button id="btn-new" class="primary">New puzzle</button>
    <button id="btn-hint">Hint</button>
    <button id="btn-check">Check</button>
    <button id="btn-solve">Show solution</button>
    <button id="btn-clear">Clear my digits</button>
  </section>

  <section class="panel">
    <div class="board-wrap">
      <div id="board" class="board" tabindex="0" aria-label="Sudoku board"></div>
      <div class="numbers">
        <div id="keypad" class="keypad" aria-label="number pad"></div>
        <button id="btn-erase" class="erase">Clear this cell</button>
        <p class="tip">
          <strong>1.</strong> Click an empty cell on the board.<br>
          <strong>2.</strong> Click a number here, or type 1 to 9 on the keyboard.
          Backspace clears a cell.
        </p>
      </div>
    </div>
    <div id="status" class="status-line">Click an empty cell, then click a number.</div>
  </section>

</main>

<script>
"use strict";

/* ------------------------------------------------------------------ logic */

const SIZE = 9;
const BOX = 3;
const EMPTY = 0;

function emptyGrid() {
  const grid = [];
  for (let r = 0; r < SIZE; r++) {
    const row = [];
    for (let c = 0; c < SIZE; c++) row.push(EMPTY);
    grid.push(row);
  }
  return grid;
}

function copyGrid(grid) {
  return grid.map(function (row) { return row.slice(); });
}

function parseGrid(text) {
  const chars = String(text).replace(/\s+/g, "");
  if (chars.length !== SIZE * SIZE) {
    throw new Error("A puzzle needs exactly 81 characters, found " + chars.length);
  }
  const flat = [];
  for (const ch of chars) {
    if (ch >= "1" && ch <= "9") flat.push(Number(ch));
    else if (ch === "0" || ch === ".") flat.push(EMPTY);
    else throw new Error("Unexpected character: " + ch);
  }
  const grid = emptyGrid();
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) grid[r][c] = flat[r * SIZE + c];
  }
  return grid;
}

function gridToText(grid) {
  const parts = [];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      parts.push(grid[r][c] === EMPTY ? "." : String(grid[r][c]));
    }
  }
  return parts.join("");
}

function candidates(grid, row, col) {
  const used = new Set();
  for (let c = 0; c < SIZE; c++) used.add(grid[row][c]);
  for (let r = 0; r < SIZE; r++) used.add(grid[r][col]);

  const boxRow = Math.floor(row / BOX) * BOX;
  const boxCol = Math.floor(col / BOX) * BOX;
  for (let r = boxRow; r < boxRow + BOX; r++) {
    for (let c = boxCol; c < boxCol + BOX; c++) used.add(grid[r][c]);
  }

  const options = [];
  for (let digit = 1; digit <= 9; digit++) {
    if (!used.has(digit)) options.push(digit);
  }
  return options;
}

function findBestEmpty(grid) {
  let best = null;
  let bestCount = 99;

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (grid[r][c] !== EMPTY) continue;
      const options = candidates(grid, r, c);
      if (options.length === 0) return { row: r, col: c };  // dead cell
      if (options.length < bestCount) {
        best = { row: r, col: c };
        bestCount = options.length;
        if (bestCount === 1) return best;
      }
    }
  }
  return best;
}

function solve(grid) {
  const cell = findBestEmpty(grid);
  if (cell === null) return true;

  const options = candidates(grid, cell.row, cell.col);
  for (const value of options) {
    grid[cell.row][cell.col] = value;
    if (solve(grid)) return true;
    grid[cell.row][cell.col] = EMPTY;
  }
  return false;
}

function solveCopy(grid) {
  const work = copyGrid(grid);
  return solve(work) ? work : null;
}

function countSolutions(grid, limit) {
  const working = copyGrid(grid);
  let count = 0;

  function search(g) {
    const cell = findBestEmpty(g);
    if (cell === null) { count += 1; return; }

    for (const value of candidates(g, cell.row, cell.col)) {
      g[cell.row][cell.col] = value;
      search(g);
      g[cell.row][cell.col] = EMPTY;
      if (count >= limit) return;
    }
  }

  search(working);
  return count;
}

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const swap = list[i];
    list[i] = list[j];
    list[j] = swap;
  }
  return list;
}

function fillGrid(grid) {
  const cell = findBestEmpty(grid);
  if (cell === null) return true;

  const options = shuffle(candidates(grid, cell.row, cell.col));
  for (const value of options) {
    grid[cell.row][cell.col] = value;
    if (fillGrid(grid)) return true;
    grid[cell.row][cell.col] = EMPTY;
  }
  return false;
}

function generatePuzzle(clues) {
  const solution = emptyGrid();
  fillGrid(solution);

  const puzzle = copyGrid(solution);
  const spots = [];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) spots.push([r, c]);
  }
  shuffle(spots);

  let remaining = SIZE * SIZE;
  for (const spot of spots) {
    if (remaining <= clues) break;
    const row = spot[0];
    const col = spot[1];
    const saved = puzzle[row][col];
    puzzle[row][col] = EMPTY;
    if (countSolutions(puzzle, 2) !== 1) puzzle[row][col] = saved;
    else remaining -= 1;
  }

  return { puzzle: puzzle, solution: solution };
}

function findConflicts(grid) {
  const bad = new Set();

  function mark(cellList) {
    const seen = new Map();
    for (const key of cellList) {
      const r = Number(key.split(",")[0]);
      const c = Number(key.split(",")[1]);
      const value = grid[r][c];
      if (value === EMPTY) continue;
      if (seen.has(value)) {
        bad.add(seen.get(value));
        bad.add(key);
      } else {
        seen.set(value, key);
      }
    }
  }

  for (let r = 0; r < SIZE; r++) {
    const rowCells = [];
    for (let c = 0; c < SIZE; c++) rowCells.push(r + "," + c);
    mark(rowCells);
  }
  for (let c = 0; c < SIZE; c++) {
    const colCells = [];
    for (let r = 0; r < SIZE; r++) colCells.push(r + "," + c);
    mark(colCells);
  }
  for (let boxRow = 0; boxRow < SIZE; boxRow += BOX) {
    for (let boxCol = 0; boxCol < SIZE; boxCol += BOX) {
      const boxCells = [];
      for (let r = boxRow; r < boxRow + BOX; r++) {
        for (let c = boxCol; c < boxCol + BOX; c++) boxCells.push(r + "," + c);
      }
      mark(boxCells);
    }
  }
  return bad;
}

function isSolved(grid) {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (grid[r][c] === EMPTY) return false;
    }
  }
  return findConflicts(grid).size === 0;
}

/* -------------------------------------------------------------------- page */

const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");
const cells = [];

let puzzle = emptyGrid();     // the clues, they never change
let grid = emptyGrid();       // what is on the board now
let solution = null;          // one known answer, used by "Check"
let selected = null;          // {row, col} or null
let checkedWrong = new Set();

function buildBoard() {
  for (let r = 0; r < SIZE; r++) {
    const rowCells = [];
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      if (c % BOX === BOX - 1 && c !== SIZE - 1) cell.classList.add("box-right");
      if (r % BOX === BOX - 1 && r !== SIZE - 1) cell.classList.add("box-bottom");
      cell.dataset.row = String(r);
      cell.dataset.col = String(c);
      cell.addEventListener("click", onCellClick);
      boardEl.appendChild(cell);
      rowCells.push(cell);
    }
    cells.push(rowCells);
  }
}

function buildKeypad() {
  const pad = document.getElementById("keypad");
  for (let digit = 1; digit <= 9; digit++) {
    const button = document.createElement("button");
    button.className = "key-btn";
    button.textContent = String(digit);
    button.addEventListener("click", function () { putDigit(digit); });
    pad.appendChild(button);
  }
  document.getElementById("btn-erase").addEventListener("click", function () {
    if (selected === null) {
      flashBoard();
      setStatus("Click a cell first, then press Clear this cell.", "bad");
      return;
    }
    if (puzzle[selected.row][selected.col] !== EMPTY) {
      setStatus("Row " + (selected.row + 1) + ", column " + (selected.col + 1) +
        " is a clue, it cannot be cleared.", "bad");
      return;
    }
    grid[selected.row][selected.col] = EMPTY;
    checkedWrong = new Set();
    render();
    setStatus("Cell cleared.");
  });
}

function flashBoard() {
  boardEl.classList.remove("need-select");
  void boardEl.offsetWidth;              // restart the animation
  boardEl.classList.add("need-select");
  window.setTimeout(function () { boardEl.classList.remove("need-select"); }, 1100);
}

function render() {
  const conflicts = findConflicts(grid);
  const selectedValue = selected === null ? EMPTY : grid[selected.row][selected.col];

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = cells[r][c];
      const value = grid[r][c];
      const key = r + "," + c;
      const isSelected = selected !== null && selected.row === r && selected.col === c;

      cell.textContent = value === EMPTY ? "" : String(value);
      cell.classList.toggle("given", puzzle[r][c] !== EMPTY);
      cell.classList.toggle("selected", isSelected);
      cell.classList.toggle("same", !isSelected && selectedValue !== EMPTY && value === selectedValue);
      cell.classList.toggle("wrong", checkedWrong.has(key) || conflicts.has(key));
      cell.classList.toggle("filled-ok",
        value !== EMPTY && puzzle[r][c] === EMPTY && !checkedWrong.has(key) && !conflicts.has(key));
    }
  }
}

function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = "status-line" + (kind ? " " + kind : "");
}

function selectCell(row, col) {
  selected = { row: row, col: col };
  render();
}

function onCellClick(event) {
  const row = Number(event.currentTarget.dataset.row);
  const col = Number(event.currentTarget.dataset.col);
  selectCell(row, col);
  boardEl.focus();

  if (puzzle[row][col] !== EMPTY) {
    setStatus("Row " + (row + 1) + ", column " + (col + 1) +
      " is a clue, it cannot be changed. Pick an empty cell.", "bad");
  } else {
    setStatus("Row " + (row + 1) + ", column " + (col + 1) +
      " selected. Click a number, or type one.");
  }
}

function putDigit(value) {
  if (selected === null) {
    flashBoard();
    setStatus("Click an empty cell on the board first, then pick a number.", "bad");
    return;
  }
  const row = selected.row;
  const col = selected.col;
  if (puzzle[row][col] !== EMPTY) {
    setStatus("Row " + (row + 1) + ", column " + (col + 1) +
      " is a clue from the puzzle, so it cannot be changed.", "bad");
    return;
  }
  grid[row][col] = value;
  checkedWrong = new Set();
  render();

  const conflicts = findConflicts(grid);
  if (conflicts.has(row + "," + col)) {
    setStatus("Row " + (row + 1) + ", column " + (col + 1) + ": " + value +
      " is already used in that row, column or box.", "bad");
  } else if (isSolved(grid)) {
    setStatus("Solved. Every cell is filled and no rule is broken.", "good");
  } else {
    let empty = 0;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === EMPTY) empty += 1;
      }
    }
    setStatus("Row " + (row + 1) + ", column " + (col + 1) + " set to " + value +
      ". " + empty + " cells still empty.");
  }
}

function newPuzzle(clues) {
  setStatus("Generating, please wait...");
  const start = performance.now();
  const made = generatePuzzle(clues);
  const took = (performance.now() - start).toFixed(0);

  puzzle = made.puzzle;
  grid = copyGrid(made.puzzle);
  solution = made.solution;
  selected = null;
  checkedWrong = new Set();
  render();

  const clueCount = countClues(puzzle);
  setStatus("New puzzle with " + clueCount + " clues, made in " + took + " ms.", "good");
}

function countClues(board) {
  let total = 0;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] !== EMPTY) total += 1;
    }
  }
  return total;
}

function loadPuzzleText(text, name) {
  const parsed = parseGrid(text);

  const start = performance.now();
  const answer = solveCopy(parsed);
  const took = (performance.now() - start).toFixed(2);

  puzzle = parsed;
  grid = copyGrid(parsed);
  solution = answer;
  selected = null;
  checkedWrong = new Set();
  render();

  if (answer === null) {
    setStatus("Loaded " + name + ", but this puzzle has no answer.", "bad");
  } else {
    setStatus("Loaded " + name + " (" + countClues(parsed) + " clues). The page solved it in " +
      took + " ms.", "good");
  }
  return answer;
}

function showSolution() {
  const start = performance.now();
  const answer = solveCopy(grid);
  const took = (performance.now() - start).toFixed(2);

  if (answer === null) {
    setStatus("No answer from the current board. One of your digits blocks every option.", "bad");
    return;
  }
  grid = answer;
  checkedWrong = new Set();
  render();
  setStatus("Filled in from the current board in " + took + " ms.", "good");
}

function checkBoard() {
  const conflicts = findConflicts(grid);
  if (conflicts.size > 0) {
    checkedWrong = conflicts;
    render();
    setStatus("Some digits repeat in a row, column or box. They are marked in red.", "bad");
    return;
  }

  if (solution === null) {
    setStatus("The board has no rule conflicts, but there is no answer to compare with.", "good");
    return;
  }

  const wrong = new Set();
  let empty = 0;
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (grid[r][c] === EMPTY) empty += 1;
      else if (grid[r][c] !== solution[r][c]) wrong.add(r + "," + c);
    }
  }

  checkedWrong = wrong;
  render();

  if (wrong.size > 0) {
    setStatus(wrong.size + " digit(s) do not match the answer. They are marked in red.", "bad");
  } else if (empty > 0) {
    setStatus("All your digits are correct so far, " + empty + " cells still empty.", "good");
  } else {
    setStatus("Correct. The puzzle is solved.", "good");
  }
}

function giveHint() {
  const empty = [];
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (grid[r][c] === EMPTY) empty.push({ row: r, col: c });
    }
  }
  if (empty.length === 0) {
    setStatus("Nothing to hint, every cell is filled.", "good");
    return;
  }

  for (const spot of empty) {
    const options = candidates(grid, spot.row, spot.col);
    if (options.length === 1) {
      grid[spot.row][spot.col] = options[0];
      selectCell(spot.row, spot.col);
      setStatus("Hint: row " + (spot.row + 1) + ", column " + (spot.col + 1) +
        " had only one option, so it is " + options[0] + ".", "good");
      return;
    }
  }

  const spot = empty[0];
  const options = candidates(grid, spot.row, spot.col);
  if (options.length === 0) {
    setStatus("Row " + (spot.row + 1) + ", column " + (spot.col + 1) +
      " has no option left, something on the board is wrong.", "bad");
    return;
  }
  selectCell(spot.row, spot.col);
  setStatus("No forced cell right now. Row " + (spot.row + 1) + ", column " + (spot.col + 1) +
    " can be " + options.join(", ") + ".", "good");
}

function clearMyDigits() {
  grid = copyGrid(puzzle);
  checkedWrong = new Set();
  render();
  setStatus("Your digits are cleared, only the original clues are left.");
}

/* ------------------------------------------------------------- start here */

const themeBtn = document.getElementById("theme-toggle");
const THEME_KEY = "sudoku-theme";

function setTheme(light) {
  document.body.classList.toggle("light", light);
  themeBtn.textContent = light ? "🌙 Dark mode" : "☀ Light mode";
  themeBtn.setAttribute("aria-pressed", light ? "true" : "false");
  themeBtn.setAttribute("title", light ? "Switch to dark mode" : "Switch to light mode");
  try { localStorage.setItem(THEME_KEY, light ? "light" : "dark"); } catch (e) {}
}

let savedTheme = null;
try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
setTheme(savedTheme === "light");

themeBtn.addEventListener("click", function () {
  setTheme(!document.body.classList.contains("light"));
});

buildBoard();
buildKeypad();

document.getElementById("btn-new").addEventListener("click", function () {
  const clues = Number(document.getElementById("clues").value);
  newPuzzle(clues);
});
document.getElementById("btn-hint").addEventListener("click", giveHint);
document.getElementById("btn-check").addEventListener("click", checkBoard);
document.getElementById("btn-solve").addEventListener("click", showSolution);
document.getElementById("btn-clear").addEventListener("click", clearMyDigits);

document.addEventListener("keydown", function (event) {
  const tag = event.target.tagName;
  if (tag === "SELECT" || tag === "INPUT" || tag === "TEXTAREA") return;
  if (event.ctrlKey || event.altKey || event.metaKey) return;

  if (event.key >= "1" && event.key <= "9") {
    putDigit(Number(event.key));
    event.preventDefault();
    return;
  }
  if (event.key === "0" || event.key === "Backspace" || event.key === "Delete") {
    if (selected !== null && puzzle[selected.row][selected.col] === EMPTY) {
      grid[selected.row][selected.col] = EMPTY;
      checkedWrong = new Set();
      render();
      setStatus("Cell cleared.");
    }
    event.preventDefault();
    return;
  }
  if (selected !== null && event.key.indexOf("Arrow") === 0) {
    let row = selected.row;
    let col = selected.col;
    if (event.key === "ArrowUp") row = Math.max(0, row - 1);
    if (event.key === "ArrowDown") row = Math.min(SIZE - 1, row + 1);
    if (event.key === "ArrowLeft") col = Math.max(0, col - 1);
    if (event.key === "ArrowRight") col = Math.min(SIZE - 1, col + 1);
    selectCell(row, col);
    event.preventDefault();
  }
});

newPuzzle(Number(document.getElementById("clues").value));
</script>
